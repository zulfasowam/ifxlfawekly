<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Mahasiswa</title>
    <link rel="stylesheet" href="css/mahasiswa.css">
</head>
<body>
    <div class="container">
        <h1>Profil & Data Mahasiswa</h1>

        <table class="nav-table"> 
            <tr>
                <td><a href="index.html">Home</a></td>
                <td><a href="Profile.html">Profile</a></td>
                <td><a href="Contact.html">Contact</a></td>
                <td><a href="mahasiswa.html" class="active">Data Mahasiswa</a></td>
            </tr>
        </table>
        
        <div class="action-section">
            <h2>Daftar Nilai Mahasiswa</h2>
            <a href="inputdata.html">
                <button class="btn-primary">Input Data Baru</button>
            </a>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th rowspan="2">No</th>
                    <th rowspan="2">Nama</th>
                    <th rowspan="2">NIM</th>
                    <th rowspan="2">Foto</th>
                    <th colspan="3">Nilai</th>
                </tr>
                <tr>
                    <th>UTS</th>
                    <th>UAS</th>
                    <th>Tugas</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="text-center">1</td>
                    <td>Kurrir</td>
                    <td class="text-center">12345678</td>
                    <td class="text-center">
                        <img src="Images/Unimus.jpg" alt="Foto Mahasiswa" class="student-photo"/>
                    </td>
                    <td class="text-center">80</td>
                    <td class="text-center">95</td>
                    <td class="text-center">89</td>
                </tr>
            </tbody>
        </table>

        <hr class="divider">

        <h2>Tabel Grid Dasar</h2>
        <table class="grid-table">
            <tr>
                <td>1,1</td>
                <td>1,2</td>
                <td>1,3</td>
                <td>1,4</td>
            </tr>
            <tr>
                <td>2,1</td>
                <td colspan="2" rowspan="2" class="highlight-cell">?</td>
                <td>2,4</td>
            </tr>
            <tr>
                <td>3,1</td>
                <td>3,4</td>
            </tr>
            <tr>
                <td>4,1</td>
                <td>4,2</td>
                <td>4,3</td>
                <td>4,4</td>
            </tr>
        </table>
    </div>
</body>
</html>
